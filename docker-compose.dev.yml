version: '3.8'

# Minimal development setup (just PostgreSQL and Redis)
services:
  postgres:
    image: postgres:16-alpine
    container_name: shopify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shopify_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: shopify_app_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopify_user -d shopify_app_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: shopify-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
